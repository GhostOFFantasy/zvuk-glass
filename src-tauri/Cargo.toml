[package]
name = "zvuk-glass"
version = "2.2.1"
description = "Zvuk Glass — неофициальный плеер для Zvuk"
authors = ["GhostOFFantasy"]
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "gzip", "brotli", "deflate", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["sync", "time"] }
futures = "0.3"
base64 = "0.22"
aes-gcm = "0.10"
regex = "1"
url = "2"
rfd = { version = "0.18", default-features = false }
arboard = { version = "3", default-features = false }
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
webview2-com = "0.39"
# автосинхронизация клипа: захват звука приложения, декодирование трека, спектр
wasapi = "0.27"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "aac", "isomp4"] }
rustfft = "6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Memory",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Performance",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
